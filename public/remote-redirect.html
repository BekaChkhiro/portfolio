<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Control Redirect</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .container {
            max-width: 400px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        
        p {
            font-size: 16px;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .redirect-button {
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .redirect-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .auto-redirect {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.7;
        }
        
        .countdown {
            font-weight: bold;
            color: #FFD700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Remote Control</h1>
        <p>თქვენ სკანირება შეასრულეთ წარმატებით!</p>
        
        <a href="http://localhost:8080" class="redirect-button" id="redirectBtn">
            🎮 დაკავშირება
        </a>
        
        <div class="auto-redirect">
            ავტომატური გადამისამართება <span class="countdown" id="countdown">3</span> წამში...
        </div>
    </div>

    <script>
        let countdown = 3;
        const countdownElement = document.getElementById('countdown');
        const redirectBtn = document.getElementById('redirectBtn');
        
        // Get the current host and port from URL parameters or default
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('url') || 'http://localhost:8080';
        
        // Update button href
        redirectBtn.href = targetUrl;
        
        // Countdown timer
        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href = targetUrl;
            }
        }, 1000);
        
        // Manual redirect button
        redirectBtn.addEventListener('click', (e) => {
            clearInterval(timer);
        });
    </script>
</body>
</html>
