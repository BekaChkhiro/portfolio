<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>📱 Phone Mouse Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .connection-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f44336;
            transition: background-color 0.3s ease;
        }

        .status-dot.connected {
            background: #4CAF50;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .trackpad {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            margin: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .trackpad.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .controls {
            padding: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .control-button {
            flex: 1;
            max-width: 120px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .control-button:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }

        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(244, 67, 54, 0.9);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            max-width: 300px;
            backdrop-filter: blur(10px);
            display: none;
        }

        .instructions {
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            font-size: 14px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 Mouse Control</h1>
            <div class="connection-status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </div>

        <div class="instructions">
            Move finger to control cursor • Tap to click • Long press for right click
        </div>

        <div class="trackpad" id="trackpad">
            <div>Trackpad Area</div>
        </div>

        <div class="controls">
            <button class="control-button" id="leftClick">Left Click</button>
            <button class="control-button" id="rightClick">Right Click</button>
        </div>
    </div>

    <div class="error-message" id="errorMessage">
        <h3>Connection Error</h3>
        <p>Could not connect to computer. Make sure both devices are on the same WiFi network.</p>
    </div>

    <script>
        class PhoneMouseControl {
            constructor() {
                this.ws = null;
                this.isConnected = false;
                this.lastTouch = { x: 0, y: 0 };
                this.longPressTimer = null;
                this.longPressDelay = 500;
                
                this.init();
            }

            init() {
                this.setupElements();
                this.setupEventListeners();
                this.connect();
            }

            setupElements() {
                this.trackpad = document.getElementById('trackpad');
                this.statusDot = document.getElementById('statusDot');
                this.statusText = document.getElementById('statusText');
                this.errorMessage = document.getElementById('errorMessage');
                this.leftClickBtn = document.getElementById('leftClick');
                this.rightClickBtn = document.getElementById('rightClick');
            }

            setupEventListeners() {
                // Trackpad touch events
                this.trackpad.addEventListener('touchstart', this.handleTouchStart.bind(this));
                this.trackpad.addEventListener('touchmove', this.handleTouchMove.bind(this));
                this.trackpad.addEventListener('touchend', this.handleTouchEnd.bind(this));

                // Button events
                this.leftClickBtn.addEventListener('click', () => this.sendMessage({ type: 'click' }));
                this.rightClickBtn.addEventListener('click', () => this.sendMessage({ type: 'rightClick' }));

                // Prevent default touch behaviors
                document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
                document.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
            }

            connect() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}`;
                
                this.ws = new WebSocket(wsUrl);

                this.ws.onopen = () => {
                    this.isConnected = true;
                    this.updateConnectionStatus('Connected', true);
                };

                this.ws.onclose = () => {
                    this.isConnected = false;
                    this.updateConnectionStatus('Disconnected', false);
                    setTimeout(() => this.connect(), 3000);
                };

                this.ws.onerror = () => {
                    this.showError();
                };
            }

            updateConnectionStatus(text, connected) {
                this.statusText.textContent = text;
                if (connected) {
                    this.statusDot.classList.add('connected');
                } else {
                    this.statusDot.classList.remove('connected');
                }
            }

            showError() {
                this.errorMessage.style.display = 'block';
                setTimeout(() => {
                    this.errorMessage.style.display = 'none';
                }, 3000);
            }

            handleTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                this.lastTouch = {
                    x: touch.clientX,
                    y: touch.clientY
                };

                this.trackpad.classList.add('active');

                // Start long press timer for right click
                this.longPressTimer = setTimeout(() => {
                    this.sendMessage({ type: 'rightClick' });
                    navigator.vibrate && navigator.vibrate(50);
                }, this.longPressDelay);
            }

            handleTouchMove(e) {
                e.preventDefault();
                if (!this.isConnected) return;

                const touch = e.touches[0];
                const deltaX = (touch.clientX - this.lastTouch.x) / window.innerWidth;
                const deltaY = (touch.clientY - this.lastTouch.y) / window.innerHeight;

                // Clear long press timer on move
                if (this.longPressTimer) {
                    clearTimeout(this.longPressTimer);
                    this.longPressTimer = null;
                }

                this.sendMessage({
                    type: 'move',
                    x: touch.clientX / window.innerWidth,
                    y: touch.clientY / window.innerHeight,
                    deltaX: deltaX * 5,
                    deltaY: deltaY * 5
                });

                this.lastTouch = {
                    x: touch.clientX,
                    y: touch.clientY
                };
            }

            handleTouchEnd(e) {
                e.preventDefault();
                this.trackpad.classList.remove('active');

                // Clear long press timer
                if (this.longPressTimer) {
                    clearTimeout(this.longPressTimer);
                    this.longPressTimer = null;

                    // If it was a short tap, send click
                    this.sendMessage({ type: 'click' });
                    navigator.vibrate && navigator.vibrate(30);
                }
            }

            sendMessage(data) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify(data));
                }
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new PhoneMouseControl();
        });

        // Prevent zoom and other touch behaviors
        document.addEventListener('gesturestart', e => e.preventDefault());
        document.addEventListener('gesturechange', e => e.preventDefault());
        document.addEventListener('gestureend', e => e.preventDefault());
    </script>
</body>
</html>
